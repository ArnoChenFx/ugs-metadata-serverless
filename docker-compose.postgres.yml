# UGS Metadata Server —— 可选：自建 PostgreSQL 模式
#
# 项目默认走纯本地 SQLite，不需要外部数据库。
# 如果你更希望用 PostgreSQL（例如多实例共享同一份数据、或已经有了现成的 PG 集群），
# 用这一份 compose 文件即可：
#
#   docker compose -f docker-compose.postgres.yml up -d
#
# 它会同时起一个 postgres 服务和一个 UGS Metadata Server，
# 并由服务名 `postgres` 自动解析地址，无需手工填写 IP。

name: ugs-metadata-postgres

services:
  postgres:
    image: postgres:17-alpine
    container_name: ugs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ugs
      # ⚠️ 生产环境请务必修改这个密码
      POSTGRES_PASSWORD: ugs
      POSTGRES_DB: ugs
    volumes:
      - ugs-pg-data:/var/lib/postgresql/data
      # 复用项目里现成的 PostgreSQL 迁移脚本，容器首次初始化时自动建表
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ugs -d ugs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ugs-metadata:
    image: ghcr.io/arnochenfx/ugs-metadata-serverless:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ugs-metadata
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://ugs:ugs@postgres:5432/ugs
      PORT: "8080"
      HOST: 0.0.0.0
      BASE_PATH: ""
    ports:
      - "${UGS_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD
        - deno
        - run
        - --no-config
        - --allow-net
        - --allow-env
        - tools/healthcheck.ts
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  ugs-pg-data:
    name: ugs-pg-data
